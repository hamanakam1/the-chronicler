[project]
name = "the-chronicler"
version = "0.1.0"
description = "The Chronicler - the local-first memory core of the autonomous AI software factory: watches the EdgeRecord ledger, extracts failure heuristics through local Ollama, and commits hardened rules and lore docs back to Git."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Michael Hamanaka" }]
keywords = ["ai", "meta-learning", "ollama", "local-first", "automation", "lowrider"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Logging",
]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/hamanakam1/the-chronicler"
Repository = "https://github.com/hamanakam1/the-chronicler"
Issues = "https://github.com/hamanakam1/the-chronicler/issues"
Changelog = "https://github.com/hamanakam1/the-chronicler/releases"

[project.scripts]
chronicler = "chronicler.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pillow>=10",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronicler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # long lines are fine in prompt templates
    "B008",   # argparse calls in defaults are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# The ASCII art files are padded deliberately: trailing spaces keep the
# wordmark aligned inside its box.
"src/chronicler/ascii_art.py" = ["W291"]
"scripts/*" = ["W291"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
files = ["src/chronicler"]
