[project]
name = "the-chronicler"
version = "0.1.0"
description = "The Chronicler - the local-first memory core of the autonomous AI software factory: watches the EdgeRecord ledger, extracts failure heuristics through local Ollama, and commits hardened rules and lore docs back to Git."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Michael Hamanaka" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[project.scripts]
chronicler = "chronicler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronicler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
